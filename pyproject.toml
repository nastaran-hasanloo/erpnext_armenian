[project]
name = "erpnext_armenian"
authors = [{ name = "ERPNext Armenian contributors" }]
description = "Armenian (hy) translation for Frappe, ERPNext and Frappe HR"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/nastaran-hasanloo/erpnext_armenian"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
